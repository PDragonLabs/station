<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDRAGONLABS Station</title>
  <meta name="description" content="PDRAGONLABS station. SoundCloud is the deck. This is the room." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Serif:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="atmos" id="atmos"></div>
  <div class="grain"></div>
  <div class="wrap">
    <header>
      <div class="brand">PDRAGONLABS · 803</div>
      <h1>Station</h1>
      <p class="tag" id="tagline">SoundCloud is the deck. This is the room.</p>
    </header>

    <section class="stage">
      <div class="poster">
        <img id="poster-art" alt="Now playing artwork" />
        <div class="shade">
          <h2 id="poster-title">—</h2>
          <p class="hook" id="poster-hook"></p>
        </div>
      </div>
      <div class="deck">
        <iframe id="deck" allow="autoplay" title="SoundCloud deck" src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/2393461635&color=c23b2a&auto_play=false"></iframe>
        <div class="now">
          <div class="now-kicker"><span id="pos">1 / 1</span> · now on the deck</div>
          <h3 id="now-title">loading</h3>
          <p class="hook" id="now-hook"></p>
          <div class="actions">
            <button class="btn" id="prev" type="button">prev</button>
            <button class="btn" id="next" type="button">next</button>
            <a class="btn" id="open-sc" href="https://soundcloud.com/pai-dj" target="_blank" rel="noreferrer">soundcloud</a>
            <button class="btn" id="share" type="button">share</button>
          </div>
          <p class="hint">arrows to walk the crate · / to search</p>
        </div>
      </div>
    </section>

    <div class="crate-bar">
      <label class="search">
        <span>tune</span>
        <input id="q" type="search" placeholder="search the crate…" autocomplete="off" />
      </label>
      <div id="count" class="count"></div>
    </div>
    <section class="grid" id="grid" aria-label="A-sides"></section>

    <footer>
      Add a song by dropping one object in catalog.json and pushing.
      <div class="links">
        <a id="canonical" href="https://soundcloud.com/pai-dj">main catalog · pai-dj</a>
        <a id="satellite" href="https://soundcloud.com/j-kast-603838038">satellite · j-kast</a>
        <a href="https://github.com/PDragonLabs/station">source</a>
      </div>
    </footer>
  </div>
  <script src="./app.js"></script>
</body>
</html>
