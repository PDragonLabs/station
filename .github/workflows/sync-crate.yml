name: Sync crate

on:
  workflow_dispatch:
    inputs:
      user:
        description: SoundCloud user slug
        required: true
        default: pai-dj
      extra_urls:
        description: Optional extra track URLs (one per line) if the profile page hides them
        required: false

permissions:
  contents: write

concurrency:
  group: sync-crate
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull public tapes and stamp cards
        env:
          SC_USER: ${{ inputs.user }}
          EXTRA: ${{ inputs.extra_urls }}
        run: |
          python3 << 'PY'
          import json, os, re, html, urllib.parse, urllib.request
          from pathlib import Path

          ua = {"User-Agent": "PDragonLabs-station/1.0"}
          user = (os.environ.get("SC_USER") or "pai-dj").strip()
          extra = os.environ.get("EXTRA") or ""

          def get(url):
              req = urllib.request.Request(url, headers=ua)
              return urllib.request.urlopen(req, timeout=25).read().decode("utf-8", "ignore")

          slugs = []
          try:
              page = get(f"https://soundcloud.com/{user}/tracks")
              for m in re.finditer(rf"https://soundcloud.com/{re.escape(user)}/([a-z0-9-]+)", page):
                  s = m.group(1)
                  if s not in ("tracks", "popular-tracks", "reposts", "sets", "comments", "followers", "following"):
                      if s not in slugs:
                          slugs.append(s)
          except Exception as e:
              print("profile fetch failed", e)

          for line in extra.splitlines():
              line = line.strip()
              if "soundcloud.com/" in line:
                  s = line.rstrip("/").split("/")[-1]
                  if s and s not in slugs:
                      slugs.append(s)

          print("found", len(slugs), slugs[:12])

          def oembed(url):
              q = "https://soundcloud.com/oembed?format=json&url=" + urllib.parse.quote(url, safe="")
              return json.loads(get(q))

          cat = json.loads(Path("catalog.json").read_text())
          have = {t.get("id") for t in cat["tracks"]} | {t.get("soundcloud") for t in cat["tracks"]}
          added = []
          Path("t").mkdir(exist_ok=True)

          # newest first if profile order is newest first
          incoming = []
          for slug in slugs:
              url = f"https://soundcloud.com/{user}/{slug}"
              if slug in have or url in have:
                  continue
              try:
                  data = oembed(url)
              except Exception as e:
                  print("oembed fail", slug, e)
                  continue
              body = data.get("html") or ""
              m = re.search(r"tracks%2F(\d+)|tracks/(\d+)", body)
              tid = (m.group(1) or m.group(2)) if m else ""
              title = re.sub(r"\s+by\s+PDRAGONLABS\s*$", "", data.get("title") or slug, flags=re.I).strip()
              hook = (data.get("description") or "").strip() or title
              rec = {
                  "id": slug,
                  "title": title,
                  "artist": data.get("author_name") or "PDRAGONLABS",
                  "genre": "untagged",
                  "soundcloud": url,
                  "trackId": tid,
                  "artwork": data.get("thumbnail_url") or "",
                  "hook": hook,
                  "note": hook,
              }
              incoming.append(rec)

          for rec in reversed(incoming):
              cat["tracks"].insert(0, rec)
              added.append(rec["id"])

          Path("catalog.json").write_text(json.dumps(cat, indent=2, ensure_ascii=False) + "\n")

          def card(rec):
              tid = rec["id"]
              title = html.escape(rec.get("title") or tid)
              hook = html.escape(rec.get("hook") or rec.get("title") or "")
              art = html.escape(rec.get("artwork") or "https://pdragonlabs.github.io/station/banner-1200x630.png")
              sc = html.escape(rec.get("soundcloud") or "")
              Path(f"t/{tid}.html").write_text(f"""<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>{title} — PDRAGONLABS</title>
<meta name="description" content="{hook}"/>
<meta property="og:title" content="{title} — PDRAGONLABS"/>
<meta property="og:image" content="{art}"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:image" content="{art}"/>
<style>body{{min-height:100vh;display:grid;place-items:center;margin:0;background:#140b12;color:#f3e6d4}}.card{{width:min(420px,92vw);border:1px solid #d4b08a;overflow:hidden}}.card img{{width:100%;aspect-ratio:1;object-fit:cover;display:block}}.copy{{padding:16px}}.actions{{display:flex;gap:8px;flex-wrap:wrap}}.actions a{{border:1px solid #d4b08a;color:#f3e6d4;text-decoration:none;padding:8px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.08em}}</style>
</head><body>
<article class="card"><img src="{art}" alt="{title}"/>
<div class="copy"><h1>{title}</h1><p class="hook">{hook}</p>
<div class="actions"><a href="../#{tid}">open in station</a><a href="{sc}">soundcloud</a></div>
</div></article></body></html>
""")

          for rec in incoming:
              card(rec)
          # also stamp cards for existing tracks missing a page
          for rec in cat["tracks"]:
              if rec.get("id") and not Path(f"t/{rec['id']}.html").exists() and rec.get("artwork"):
                  card(rec)
          print("added", added)
          PY
      - name: Commit
        run: |
          git config user.name "PDragonLabs"
          git config user.email "131260835+PDragonLabs@users.noreply.github.com"
          git add catalog.json t/
          if git diff --cached --quiet; then echo "crate already current"; exit 0; fi
          git commit -m "Sync crate from SoundCloud"
          git push
